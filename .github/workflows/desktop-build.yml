name: Build desktop installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release with all three language model ZIPs
        required: true
        default: v3.0.3
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Restore optional model weights
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p language-packs
          gh release download "$RELEASE_TAG" --pattern "FarmPilot_Models_*.zip" --dir language-packs
          python scripts/restore-release-models.py language-packs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bundled web app
        run: pnpm build:offline
      - name: Install desktop build tools
        run: npm --prefix desktop ci
      - name: Check local asset loader
        run: pnpm test:desktop
      - name: Verify complete offline package
        run: pnpm test:offline
      - name: Verify desktop asset responses
        run: node scripts/verify-desktop-assets.mjs public
      - name: Build native installer
        run: npm --prefix desktop run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: farmpilot-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          installers=(release/*.exe release/*.dmg)
          test "${#installers[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${installers[@]}" --clobber
